{% extends "base.html" %}
{% block title %}Mon compte{% endblock %}
{% block content %}
<h1>Mon compte</h1>
<div class="card narrow">
  <p><strong>{{ current_user().name }}</strong><br><span class="muted">{{ current_user().email }}</span></p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Mot de passe actuel <input type="password" name="old" autocomplete="current-password" required></label>
    <label>Nouveau mot de passe (8 caractères min.) <input type="password" name="new" autocomplete="new-password" minlength="8" required></label>
    <label>Confirmer <input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>
    <button class="btn primary block">Enregistrer</button>
  </form>
</div>
{% endblock %}
